# Tests every push and pull request. Pushes to main also deploy the demo to
# Cloudflare Workers (see docs/DEPLOY.md) and run the HTTP tests against it.
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN (the "Edit
# Cloudflare Workers" token template plus D1: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them the deploy job is skipped with a warning.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ steps.deploy.outputs.shell }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        id: deploy
        run: npm run deploy
      - name: Wait for the Workers to answer
        if: steps.secrets.outputs.ok == 'true'
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ steps.deploy.outputs.shell }}/.well-known/web-identity" > /dev/null && exit 0
            sleep 5
          done
          echo "::error::Shell did not answer after deploy"; exit 1
      - name: HTTP tests against the deployment
        if: steps.secrets.outputs.ok == 'true'
        env:
          ATWORKPLACE_ORIGINS: ${{ steps.deploy.outputs.origins }}
        run: npx tsx --test test/fedcm-idps.test.ts
